<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#03060a">
<title>심연의 다이스 포션 — Cthulhu Dice Potion</title>
<style>
  :root{
    --ink:#c9ded9;
    --dim:#5f7b80;
    --line:rgba(110,170,165,.16);
    --accent:#5ff0d4;
    --gold:#ffd479;
    --blood:#ff5a52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:#03060a;color:var(--ink);
    font-family:"Iowan Old Style","Apple SD Gothic Neo","Noto Serif KR",Georgia,"Times New Roman",serif;
    display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow-x:hidden;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
    overscroll-behavior-y:contain;   /* iOS 당겨서 새로고침이 흔들기를 가로채지 않게 */
  }
  #abyss{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  body::after{ /* 필름 그레인 */
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.055;z-index:20;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px;
    mix-blend-mode:overlay;
  }
  /* 결과 순간의 화면 효과 */
  #flash{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;transition:opacity .9s}
  #flash.crit{opacity:.5;background:radial-gradient(120% 90% at 50% 55%,rgba(255,196,90,.30),transparent 62%);transition:opacity .12s}
  #flash.fumble{opacity:.6;background:radial-gradient(120% 90% at 50% 55%,rgba(150,0,0,.34),transparent 58%),
                                    radial-gradient(circle at 50% 55%,transparent 40%,rgba(60,0,0,.55));transition:opacity .1s}
  body.quake{animation:quake .5s cubic-bezier(.36,.07,.19,.97)}
  @keyframes quake{
    10%,90%{transform:translate(-2px,1px) rotate(-.25deg)}
    30%,70%{transform:translate(4px,-2px) rotate(.4deg)}
    50%{transform:translate(-5px,2px) rotate(-.5deg)}
  }

  header{position:relative;z-index:2;text-align:center;padding:16px 16px 2px}
  h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.4em;text-transform:uppercase;
     color:#8fc8c4;text-indent:.4em;text-shadow:0 0 22px rgba(95,240,212,.25)}
  .rlyeh{margin:7px 0 0;font-size:9.5px;letter-spacing:.3em;color:#3f5f63;text-indent:.3em;font-style:italic}
  .sub{margin:4px 0 0;font-size:11px;letter-spacing:.22em;color:var(--dim);text-indent:.22em}

  .stage{
    position:relative;z-index:2;margin:0;cursor:grab;
    /* 높이를 기준으로 잡고 폭을 계산한다. aspect-ratio에 기대지 않아 구버전에서도 안전하다 */
    --sh:min(54vh, calc(86vw / .62), 600px);
    height:var(--sh);width:calc(var(--sh) * .62);
    touch-action:none;   /* 드래그가 페이지 스크롤로 먹히는 걸 막는다 */
  }
  .stage:active{cursor:grabbing}
  canvas{display:block;width:100%;height:100%}

  .readout{position:absolute;left:0;right:0;top:60%;transform:translateY(-50%);text-align:center;pointer-events:none}
  .diceTag{font-size:10px;letter-spacing:.3em;color:rgba(150,200,205,.4);text-indent:.3em;margin-bottom:3px}
  .value{
    font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:#dff7f4;
    text-shadow:0 0 24px rgba(95,240,212,.55),0 0 60px rgba(60,180,200,.35);
    transition:color .5s,text-shadow .5s,opacity .35s;
  }
  .hint{font-size:10.5px;letter-spacing:.24em;color:rgba(140,190,195,.36);text-indent:.24em;
        margin-top:9px;transition:opacity .5s}
  .value.crit{color:#fff0c2;text-shadow:0 0 28px rgba(255,212,121,.9),0 0 76px rgba(255,170,50,.5)}
  .value.extreme{color:#c8fff2;text-shadow:0 0 26px rgba(95,240,212,.9),0 0 70px rgba(60,220,200,.45)}
  .value.hard{color:#d5f5e8;text-shadow:0 0 22px rgba(110,220,180,.7),0 0 55px rgba(60,180,150,.3)}
  .value.ok{color:#dff7f4;text-shadow:0 0 20px rgba(120,200,210,.6)}
  .value.fail{color:#93a9b1;text-shadow:0 0 18px rgba(80,120,135,.45)}
  .value.fumble{color:#ffc7c2;text-shadow:0 0 28px rgba(255,90,82,.85),0 0 76px rgba(170,15,15,.55)}

  .verdict{position:relative;z-index:2;height:74px;text-align:center;
           display:flex;flex-direction:column;justify-content:center;gap:6px}
  .vLabel{font-size:14px;letter-spacing:.3em;text-indent:.3em;opacity:0;transform:translateY(6px);
          transition:opacity .6s,transform .6s}
  .vLabel.show{opacity:1;transform:none}
  .vDetail{font-size:11px;letter-spacing:.12em;color:var(--dim);opacity:0;transition:opacity .6s}
  .vDetail.show{opacity:1}
  .whisper{font-size:11px;font-style:italic;letter-spacing:.14em;color:#4a6a6c;opacity:0;
           transition:opacity 1.1s;min-height:14px}
  .whisper.show{opacity:1}
  .vLabel.crit{color:var(--gold);text-shadow:0 0 20px rgba(255,212,121,.5)}
  .vLabel.extreme{color:#7ff5dd}
  .vLabel.hard{color:#7fdcb4}
  .vLabel.ok{color:#a9d8dd}
  .vLabel.fail{color:#748b94}
  .vLabel.fumble{color:var(--blood);text-shadow:0 0 22px rgba(255,60,50,.55)}
  .whisper.fumble{color:#a8595a}
  .whisper.crit{color:#9a8757}

  .panel{position:relative;z-index:2;width:min(92vw,420px);padding:0 6px 24px;
         display:flex;flex-direction:column;gap:13px}
  .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .chip{font:inherit;font-size:12px;letter-spacing:.1em;padding:7px 12px;border-radius:2px;cursor:pointer;
        background:rgba(16,34,40,.45);color:#89aeb2;border:1px solid var(--line);transition:.22s}
  .chip:hover{border-color:rgba(120,220,215,.4);color:#cfeeee}
  .chip[aria-pressed="true"]{background:rgba(40,130,120,.16);border-color:rgba(95,240,212,.5);
        color:#d8fff7;box-shadow:0 0 14px rgba(95,240,212,.16) inset}
  .skillBox{display:none;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .skillBox.show{display:flex}
  .skillBox input{font:inherit;font-size:13px;background:rgba(8,20,26,.65);color:var(--ink);
        border:1px solid var(--line);border-radius:2px;padding:8px 10px;text-align:center;outline:none;transition:.2s}
  .skillBox input:focus{border-color:rgba(95,240,212,.45)}
  .skillBox input::placeholder{color:#425c64}
  #skillName{width:126px}
  #skillValue{width:72px}
  .note{font-size:10px;color:#456068;letter-spacing:.14em;text-align:center}
  .actions{display:flex;gap:8px;justify-content:center;align-items:center}
  .btn{font:inherit;font-size:12px;letter-spacing:.18em;text-indent:.18em;padding:11px 22px;border-radius:2px;
       cursor:pointer;background:linear-gradient(180deg,rgba(26,62,66,.5),rgba(11,29,34,.5));
       color:#bfeae6;border:1px solid rgba(120,220,215,.28);transition:.2s}
  .btn:hover{border-color:rgba(120,220,215,.55);box-shadow:0 0 18px rgba(95,240,212,.14)}
  .btn:active{transform:translateY(1px)}
  .icoBtn{width:38px;height:38px;padding:0;font-size:14px;text-indent:0;letter-spacing:0;display:grid;place-items:center}
  .icoBtn[aria-pressed="false"]{opacity:.38}
  .log{min-height:16px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
       font-size:11px;color:#557179;letter-spacing:.1em}
  .log span{padding:2px 7px;border:1px solid rgba(110,170,165,.12);border-radius:2px}
  .log span:first-child{color:#9fd0d0;border-color:rgba(120,220,215,.26)}
  footer{position:relative;z-index:2;font-size:9.5px;color:#33484f;letter-spacing:.18em;padding-bottom:20px;text-align:center}

  /* 키보드 포커스 */
  .chip:focus-visible,.btn:focus-visible,.skillBox input:focus-visible,.stage:focus-visible{
    outline:2px solid rgba(95,240,212,.75);outline-offset:2px;
  }
  .stage:focus-visible{border-radius:4px}

  /* 흔들림에 민감한 사용자를 위해 화면 효과를 끈다 */
  @media (prefers-reduced-motion:reduce){
    body.quake{animation:none}
    #flash.crit,#flash.fumble{transition:opacity .6s}
  }
</style>
</head>
<body>

<canvas id="abyss"></canvas>
<div id="flash"></div>

<header>
  <h1>Dice Potion</h1>
  <p class="rlyeh">ph'nglui mglw'nafh cthulhu r'lyeh wgah'nagl fhtagn</p>
  <p class="sub">심연에서 건져 올린 금단의 시약</p>
</header>

<div class="stage" id="stage" tabindex="0" role="button" aria-label="포션 병 흔들기">
  <canvas id="potion"></canvas>
  <div class="readout">
    <div class="diceTag" id="diceTag">1D100</div>
    <div class="value" id="value">?</div>
    <div class="hint" id="hint">흔들어 깨워라</div>
  </div>
</div>

<div class="verdict">
  <div class="vLabel" id="vLabel"></div>
  <div class="vDetail" id="vDetail"></div>
  <div class="whisper" id="whisper"></div>
</div>

<div class="panel">
  <div class="row" id="modes"></div>
  <div class="skillBox" id="skillBox">
    <input id="skillName" type="text" placeholder="기능명 (예: 관찰력)" autocomplete="off" spellcheck="false">
    <input id="skillValue" type="number" min="1" max="100" placeholder="기능치" inputmode="numeric">
  </div>
  <div class="actions">
    <button class="btn" id="motionBtn" hidden>센서 허용</button>
    <button class="btn" id="shakeBtn">병 흔들기</button>
    <button class="btn icoBtn" id="soundBtn" aria-pressed="false" title="소리">♪</button>
  </div>
  <p class="note" id="note">병을 잡고 흔들거나 · 길게 눌러 흔들기 · Space</p>
  <div class="log" id="log"></div>
</div>

<footer>CoC 7th · crypto RNG</footer>

<script>
(() => {
"use strict";

/* ================= 난수 (연출과 완전히 분리) ================= */
const rollDie = (faces) => {
  const limit = Math.floor(4294967296 / faces) * faces;
  const buf = new Uint32Array(1);
  let v;
  do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
  return (v % faces) + 1;
};
/* 연출 전용 결정론적 PRNG (룬 모양 고정용) */
const mulberry32 = (a) => () => {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

/* ================= 다이스 모드 ================= */
const MODES = [
  { id:"d100", label:"1D100", count:1, faces:100, coc:true },
  { id:"d10",  label:"1D10",  count:1, faces:10  },
  { id:"d6",   label:"1D6",   count:1, faces:6   },
  { id:"d8",   label:"1D8",   count:1, faces:8   },
  { id:"d4",   label:"1D4",   count:1, faces:4   },
  { id:"d3",   label:"1D3",   count:1, faces:3   },
  { id:"d20",  label:"1D20",  count:1, faces:20  },
  { id:"2d6",  label:"2D6",   count:2, faces:6   },
  { id:"3d6",  label:"3D6",   count:3, faces:6   },
];
let mode = MODES[0];

/* ================= CoC 7판 판정 ================= */
function judge(roll, skill){
  if (!skill || skill < 1) return null;
  if (roll === 1) return { key:"crit",    label:"대성공" };
  if (roll === 100 || (roll >= 96 && skill < 50)) return { key:"fumble", label:"대실패" };
  if (roll <= Math.floor(skill / 5)) return { key:"extreme", label:"극단적 성공" };
  if (roll <= Math.floor(skill / 2)) return { key:"hard",    label:"어려운 성공" };
  if (roll <= skill)                 return { key:"ok",      label:"성공" };
  return { key:"fail", label:"실패" };
}

const TINT = {
  crit:    [255, 206, 110],
  extreme: [ 95, 240, 212],
  hard:    [ 96, 220, 170],
  ok:      [104, 198, 205],
  fail:    [ 78, 118, 132],
  fumble:  [214,  36,  30],
  plain:   [ 96, 205, 200],
};

const WHISPERS = {
  crit:    ["이아! 이아! 그것이 미소 짓는다", "별들이 옳게 늘어섰다", "심연이 너의 이름을 기억했다"],
  extreme: ["검은 물결이 순순히 갈라진다", "네 손끝을 무언가가 인도했다"],
  hard:    ["시약이 마지못해 답한다", "수면 아래에서 무언가 고개를 끄덕였다"],
  ok:      ["숫자가 조용히 떠오른다", "심연은 이번만 관대하다"],
  fail:    ["아무것도 떠오르지 않는다", "심연은 침묵한다", "그것은 대답할 가치를 못 느꼈다"],
  fumble:  ["그것이 너를 보았다", "프타근… 돌이킬 수 없다", "유리 너머에서 무언가 웃었다", "이제 그것은 네 이름을 안다"],
  plain:   ["시약이 답한다"],
};
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ================= DOM ================= */
const $ = (id) => document.getElementById(id);
const stage = $("stage"), cv = $("potion"), ctx = cv.getContext("2d");
const bg = $("abyss"), bctx = bg.getContext("2d");
const elValue = $("value"), elTag = $("diceTag"), elHint = $("hint");
const elVLabel = $("vLabel"), elVDetail = $("vDetail"), elWhisper = $("whisper");
const elLog = $("log"), elFlash = $("flash");
const elSkillBox = $("skillBox"), elSkillName = $("skillName"), elSkillValue = $("skillValue");

/* ================= 상태 ================= */
const S = {
  phase: "idle",       // idle | shaking | settling | revealed
  energy: 0, turbid: 0,
  shakeStart: 0, settleStart: 0,
  pending: null, result: null,
  tint: TINT.plain, glow: 0,
  tentacle: .12,       // 촉수는 늘 옅게 존재한다
  dread: 0,            // 배경 실루엣이 떠오르는 정도
  slope: 0,
  offX: 0, offY: 0, velX: 0, velY: 0, rot: 0,
  ritual: 0,           // 의식 서클 밝기
  eye: 0,              // 액체 속 눈이 뜬 정도 0..1
  eyeX: .5, eyeY: .66, eyeKey: "plain",
  nextBlink: 6000, blinkUntil: 0,
};
const MIN_SHAKE_MS = 700;
const SETTLE_MS = 1700;

/* ================= 캔버스 ================= */
let W = 0, H = 0, DPR = 1, BW = 0, BH = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  BW = window.innerWidth; BH = window.innerHeight;
  bg.width = Math.round(BW * DPR); bg.height = Math.round(BH * DPR);
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

/* 병 외곽선 */
function bottlePath(){
  const p = new Path2D(), X = (n) => n * W, Y = (n) => n * H;
  p.moveTo(X(.415), Y(.115));
  p.lineTo(X(.415), Y(.30));
  p.bezierCurveTo(X(.415), Y(.385), X(.195), Y(.38), X(.172), Y(.50));
  p.lineTo(X(.158), Y(.845));
  p.quadraticCurveTo(X(.158), Y(.955), X(.285), Y(.955));
  p.lineTo(X(.715), Y(.955));
  p.quadraticCurveTo(X(.842), Y(.955), X(.842), Y(.845));
  p.lineTo(X(.828), Y(.50));
  p.bezierCurveTo(X(.805), Y(.38), X(.585), Y(.385), X(.585), Y(.30));
  p.lineTo(X(.585), Y(.115));
  p.closePath();
  return p;
}
let PATH = null;

function halfWidth(y){
  const n = y / H, neck = .082 * W, body = .325 * W;
  if (n < .30) return neck;
  if (n > .52){
    const t = Math.min(1, Math.max(0, (n - .90) / .06));
    return body * (1 - .10 * t * t);
  }
  const t = (n - .30) / .22, s = t * t * (3 - 2 * t);
  return neck + (body - neck) * s;
}
const SURFACE = .345;

/* ================= 파티클 ================= */
const motes = [], bubbles = [];
function initMotes(){
  motes.length = 0;
  const n = window.innerWidth < 420 ? 90 : 130;
  for (let i = 0; i < n; i++){
    motes.push({
      x:.5 + (Math.random() - .5) * .5, y:SURFACE + Math.random() * (.94 - SURFACE),
      vx:0, vy:0, r:.4 + Math.random() * 2.1, a:.18 + Math.random() * .5,
      seed:Math.random() * 100, flick:Math.random() * 6.28,
    });
  }
}

/* ================= 입력 ================= */
function addEnergy(v){
  S.energy = Math.min(1.6, S.energy + v);
  if (S.energy > .34) beginShake();
}
function beginShake(){
  if (S.phase === "shaking" || S.phase === "settling") return;
  S.phase = "shaking";
  S.shakeStart = performance.now();
  S.pending = computeRoll();
  S.result = null; S.glow = 0; S.tint = TINT.plain; S.eye = 0;
  elValue.className = "value";
  elValue.style.opacity = "0";
  elVLabel.className = "vLabel"; elVDetail.className = "vDetail"; elWhisper.className = "whisper";
  elHint.style.opacity = "0";
  elFlash.className = "";
}
function computeRoll(){
  const values = [];
  if (mode.id === "d100"){
    const tens = rollDie(10) - 1, ones = rollDie(10) - 1;
    let total = tens * 10 + ones;
    if (total === 0) total = 100;
    values.push(total);
    const skill = clampSkill(elSkillValue.value);
    return { values, total, verdict: judge(total, skill), skill };
  }
  let total = 0;
  for (let i = 0; i < mode.count; i++){ const v = rollDie(mode.faces); values.push(v); total += v; }
  return { values, total, verdict:null, skill:null };
}
function clampSkill(raw){
  const n = parseInt(raw, 10);
  return Number.isFinite(n) ? Math.min(100, Math.max(1, n)) : null;
}

let dragging = false, lastPX = 0, lastPY = 0, lastPT = 0, travel = 0;
stage.addEventListener("pointerdown", (e) => {
  dragging = true; travel = 0;
  lastPX = e.clientX; lastPY = e.clientY; lastPT = performance.now();
  stage.setPointerCapture(e.pointerId); audio.unlock();
});
stage.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const now = performance.now(), dt = Math.max(8, now - lastPT);
  const dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  const dist = Math.hypot(dx, dy);
  travel += dist;
  addEnergy(Math.min(.30, (dist / dt) * .16));
  S.velX += dx * .28; S.velY += dy * .18; S.slope += dx * .0009;
  lastPX = e.clientX; lastPY = e.clientY; lastPT = now;
});
const endDrag = () => {
  if (!dragging) return;
  dragging = false;
  if (travel < 14) addEnergy(.95);      // 단순 탭도 굴러가게
};
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

let holding = false;
const holdBtn = $("shakeBtn");
holdBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); holding = true; audio.unlock(); });
["pointerup","pointerleave","pointercancel"].forEach((ev) => holdBtn.addEventListener(ev, () => { holding = false; }));
window.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || e.repeat) return;
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  e.preventDefault(); holding = true; audio.unlock();
});
window.addEventListener("keyup", (e) => { if (e.code === "Space") holding = false; });

/* 디바이스 모션 */
let lastAcc = null, motionSeen = false;
function onMotion(e){
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  motionSeen = true;
  if (lastAcc){
    // 정지 시 노이즈는 0.2 안팎이라 1.6이면 충분히 안전하다
    const d = Math.hypot(a.x - lastAcc.x, a.y - lastAcc.y, a.z - lastAcc.z);
    if (d > 1.6) addEnergy(Math.min(.34, (d - 1.6) * .05));
  }
  lastAcc = { x:a.x, y:a.y, z:a.z };
}
function onOrient(e){
  if (e.gamma == null) return;
  const g = Math.max(-45, Math.min(45, e.gamma));
  S.slope += (g * .0022 - S.slope) * .08;
}
function attachMotion(){
  window.addEventListener("devicemotion", onMotion);
  window.addEventListener("deviceorientation", onOrient);
}

/* ================= 오디오 ================= */
const audio = (() => {
  let ac = null, master = null, band = null, sloshGain = null, drone = null, droneGain = null;
  let on = false, unlocked = false;

  function build(){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);

    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++){
      const white = Math.random() * 2 - 1;
      last = (last + .02 * white) / 1.02;
      d[i] = last * 3.5;
    }
    const noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
    band = ac.createBiquadFilter(); band.type = "bandpass"; band.frequency.value = 420; band.Q.value = .8;
    sloshGain = ac.createGain(); sloshGain.gain.value = 0;
    noise.connect(band); band.connect(sloshGain); sloshGain.connect(master);
    noise.start();

    // 심연의 저음 드론
    drone = ac.createOscillator(); drone.type = "sine"; drone.frequency.value = 42;
    const drone2 = ac.createOscillator(); drone2.type = "sine"; drone2.frequency.value = 42.7;
    droneGain = ac.createGain(); droneGain.gain.value = .085;
    drone.connect(droneGain); drone2.connect(droneGain); droneGain.connect(master);
    drone.start(); drone2.start();
  }
  return {
    unlock(){
      if (unlocked) return;
      unlocked = true;
      try { build(); } catch (_) { return; }
      if (ac.state === "suspended") ac.resume();
      master.gain.value = on ? .9 : 0;
    },
    toggle(){
      on = !on; this.unlock();
      if (master) master.gain.setTargetAtTime(on ? .9 : 0, ac.currentTime, .05);
      return on;
    },
    frame(energy){
      if (!ac || !on) return;
      sloshGain.gain.setTargetAtTime(Math.min(.5, energy * .5), ac.currentTime, .08);
      band.frequency.setTargetAtTime(280 + energy * 900, ac.currentTime, .1);
      droneGain.gain.setTargetAtTime(.085 + S.dread * .13, ac.currentTime, .3);
    },
    reveal(key){
      if (!ac || !on) return;
      const t = ac.currentTime;
      const base = key === "fumble" ? 58 : key === "crit" ? 196 : 130;
      const parts = key === "fumble" ? [1, 1.06, 1.49] : [1, 1.5, 2.01];
      parts.forEach((m, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = i === 0 ? "sine" : "triangle";
        o.frequency.value = base * m;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(.22 / (i + 1), t + .04);
        g.gain.exponentialRampToValueAtTime(.0006, t + (key === "fumble" ? 3.4 : 2.4));
        o.connect(g); g.connect(master); o.start(t); o.stop(t + 3.5);
      });
    },
  };
})();

});

/* ================= 룬 · 의식 서클 ================= */
function drawGlyph(c, x, y, size, seed){
  const rnd = mulberry32(seed);
  const strokes = 3 + Math.floor(rnd() * 3);
  c.beginPath();
  for (let i = 0; i < strokes; i++){
    const a1 = rnd() * Math.PI * 2, a2 = a1 + (rnd() - .5) * 3;
    const r1 = .3 + rnd() * .7, r2 = .3 + rnd() * .7;
    c.moveTo(x + Math.cos(a1) * size * r1, y + Math.sin(a1) * size * r1);
    if (rnd() > .45){
      c.lineTo(x + Math.cos(a2) * size * r2, y + Math.sin(a2) * size * r2);
    } else {
      const am = (a1 + a2) / 2;
      c.quadraticCurveTo(x + Math.cos(am) * size * 1.25, y + Math.sin(am) * size * 1.25,
                         x + Math.cos(a2) * size * r2,   y + Math.sin(a2) * size * r2);
    }
  }
  if (rnd() > .6){ c.moveTo(x + size * .5, y); c.arc(x, y, size * .5, 0, Math.PI * 2); }
  c.stroke();
}

function drawRitual(t){
  const cx = W * .5, cy = H * .60;
  const a = .10 + S.ritual * .55 + S.glow * .22;
  const [r, g, b] = S.tint;
  ctx.save();
  ctx.strokeStyle = `rgba(${100 + r * .35},${190 + g * .18},${185 + b * .2},${a})`;
  ctx.lineWidth = 1;

  // 바깥 룬 고리 (시계방향)
  const R1 = Math.min(W, H) * .43;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .00006);
  for (let i = 0; i < 16; i++){
    const ang = (i / 16) * Math.PI * 2;
    ctx.save();
    ctx.translate(Math.cos(ang) * R1, Math.sin(ang) * R1);
    ctx.rotate(ang + Math.PI / 2);
    drawGlyph(ctx, 0, 0, W * .019, i * 977 + 13);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, R1 * 1.14, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // 안쪽 고리 (반시계) + 눈금
  const R2 = Math.min(W, H) * .335;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-t * .00011);
  ctx.beginPath(); ctx.arc(0, 0, R2, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i < 48; i++){
    const ang = (i / 48) * Math.PI * 2, len = (i % 4 === 0) ? 9 : 4;
    ctx.moveTo(Math.cos(ang) * R2, Math.sin(ang) * R2);
    ctx.lineTo(Math.cos(ang) * (R2 + len), Math.sin(ang) * (R2 + len));
  }
  ctx.stroke();
  // 오각별
  ctx.beginPath();
  for (let i = 0; i <= 5; i++){
    const ang = (i * 4 / 5) * Math.PI * 2 - Math.PI / 2;
    const px = Math.cos(ang) * R2 * .96, py = Math.sin(ang) * R2 * .96;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.globalAlpha = .5; ctx.stroke(); ctx.globalAlpha = 1;
  ctx.restore();
  ctx.restore();
}

/* 병에 새겨진 세로 룬 */
function drawEtchedRunes(t){
  const a = .16 + S.ritual * .5;
  ctx.save();
  ctx.strokeStyle = `rgba(190,255,245,${a})`;
  ctx.lineWidth = 1.1;
  ctx.shadowColor = "rgba(95,240,212,.6)";
  ctx.shadowBlur = 4 + S.ritual * 10;
  for (let i = 0; i < 3; i++) drawGlyph(ctx, W * .5, H * (.175 + i * .05), W * .017, 4200 + i * 31);
  ctx.restore();
}

/* ================= 눈 ================= */
function drawEye(c, x, y, rx, open, key, alpha){
  if (open <= .02 || alpha <= .01) return;
  const ry = rx * .68 * open;
  const [r, g, b] = TINT[key] || TINT.plain;
  c.save();
  c.globalAlpha = alpha;

  const halo = c.createRadialGradient(x, y, 0, x, y, rx * 2.2);
  halo.addColorStop(0, `rgba(${r},${g},${b},${.30 * open})`);
  halo.addColorStop(1, `rgba(${r},${g},${b},0)`);
  c.fillStyle = halo;
  c.fillRect(x - rx * 2.2, y - rx * 2.2, rx * 4.4, rx * 4.4);

  // 아몬드형 흰자
  c.beginPath();
  c.moveTo(x - rx, y);
  c.quadraticCurveTo(x, y - ry * 2.1, x + rx, y);
  c.quadraticCurveTo(x, y + ry * 2.1, x - rx, y);
  c.closePath();
  const sg = c.createRadialGradient(x, y, 0, x, y, rx);
  sg.addColorStop(0, key === "fumble" ? "rgba(255,222,214,.95)" : "rgba(232,255,246,.92)");
  sg.addColorStop(1, key === "fumble" ? "rgba(150,60,50,.7)" : "rgba(90,160,155,.65)");
  c.fillStyle = sg; c.fill();
  c.strokeStyle = "rgba(6,14,16,.65)"; c.lineWidth = 1.4; c.stroke();

  // 홍채 + 세로 동공
  c.save();
  c.clip();
  c.beginPath(); c.arc(x, y, ry * 1.05, 0, Math.PI * 2);
  const ig = c.createRadialGradient(x, y, ry * .2, x, y, ry * 1.05);
  ig.addColorStop(0, `rgba(${r},${g},${b},.95)`);
  ig.addColorStop(1, `rgba(${r * .25},${g * .3},${b * .3},.95)`);
  c.fillStyle = ig; c.fill();

  c.beginPath();
  c.ellipse(x, y, Math.max(1, rx * .07), ry * .95, 0, 0, Math.PI * 2);
  c.fillStyle = "rgba(2,4,6,.96)"; c.fill();
  c.restore();

  c.beginPath();
  c.arc(x - rx * .22, y - ry * .35, rx * .07, 0, Math.PI * 2);
  c.fillStyle = "rgba(255,255,255,.75)"; c.fill();
  c.restore();
}

/* ================= 액체 ================= */
function waveY(x, t){
  const amp = 2 + S.energy * 16 + S.turbid * 3;
  const base = SURFACE * H + Math.sin(t * .0011) * (1 + S.energy * 5) + S.offY * .35;
  return base + S.slope * (x - W / 2)
    + Math.sin(x * .045 + t * .006) * amp
    + Math.sin(x * .021 - t * .0041) * amp * .6;
}
function drawLiquid(t){
  const [r, g, b] = S.tint, mix = S.glow * .55;
  const grad = ctx.createLinearGradient(0, SURFACE * H, 0, H);
  grad.addColorStop(0,   `rgba(${16 + r * mix * .5},${58 + g * mix * .35},${62 + b * mix * .3},.93)`);
  grad.addColorStop(.42, `rgba(${9  + r * mix * .35},${30 + g * mix * .28},${44 + b * mix * .3},.96)`);
  grad.addColorStop(1,   `rgba(${5  + r * mix * .25},${11 + g * mix * .2},${22 + b * mix * .25},.99)`);
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 5) ctx.lineTo(x, waveY(x, t));
  ctx.lineTo(W, H); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  for (let x = 0; x <= W; x += 5){
    const y = waveY(x, t);
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = `rgba(${140 + r * .3},230,230,${.20 + S.energy * .3})`;
  ctx.lineWidth = 1.4; ctx.stroke();
}

function drawMotes(t){
  const [r, g, b] = S.tint;
  for (const m of motes){
    const swirl = S.energy;
    const px = m.x * W, py = m.y * H;
    const n1 = Math.sin(py * .02 + t * .0016 + m.seed) * Math.cos(px * .017 - t * .0011);
    const n2 = Math.cos(px * .022 - t * .0013 + m.seed) * Math.sin(py * .015 + t * .0009);
    m.vx += n1 * (.05 + swirl * .95) * .04;
    m.vy += n2 * (.05 + swirl * .95) * .04;
    m.vy += (1 - Math.min(1, swirl * 2.2)) * .0016 * (m.r * .5);
    m.vx *= .93; m.vy *= .93;
    m.x += m.vx * .006; m.y += m.vy * .006;

    const hw = halfWidth(m.y * H) / W;
    if (m.x < .5 - hw + .012){ m.x = .5 - hw + .012; m.vx = Math.abs(m.vx) * .5; }
    if (m.x > .5 + hw - .012){ m.x = .5 + hw - .012; m.vx = -Math.abs(m.vx) * .5; }
    const top = SURFACE + .015, bot = .935;
    if (m.y < top){ m.y = top; m.vy = Math.abs(m.vy) * .4; }
    if (m.y > bot){ m.y = bot; m.vy = -Math.abs(m.vy) * .25; }

    // 생물발광처럼 깜빡인다
    const flick = .65 + .35 * Math.sin(t * .004 + m.flick);
    const a = m.a * (.35 + S.turbid * .8) * (.6 + S.glow * .7) * flick;
    ctx.beginPath();
    ctx.arc(m.x * W, m.y * H, m.r * (1 + S.energy * .4), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${120 + r * .45},${200 + g * .2},${200 + b * .2},${a})`;
    ctx.fill();
  }
}

function drawBubbles(t, dt){
  if (Math.random() < S.energy * .55 + .03){
    bubbles.push({ x:.5 + (Math.random() - .5) * .38, y:.93, r:.6 + Math.random() * 2.4,
                   v:.00018 + Math.random() * .0006 });
  }
  for (let i = bubbles.length - 1; i >= 0; i--){
    const bu = bubbles[i];
    bu.y -= bu.v * dt * (1 + S.energy * 3);
    bu.x += Math.sin(bu.y * 40 + i) * .0006;
    if (bu.y * H < waveY(bu.x * W, t) + 4){ bubbles.splice(i, 1); continue; }
    ctx.beginPath(); ctx.arc(bu.x * W, bu.y * H, bu.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(190,245,240,${.10 + S.energy * .28})`;
    ctx.lineWidth = .9; ctx.stroke();
  }
  if (bubbles.length > 140) bubbles.splice(0, bubbles.length - 140);
}

/* 촉수: 빨판까지 있는 실루엣 */
function drawTentacles(t){
  const a = Math.min(.62, S.tentacle * .6 + S.energy * .12);
  if (a < .03) return;
  ctx.save();
  for (let k = 0; k < 4; k++){
    const phase = t * .0011 + k * 1.7;
    const baseX = W * (.28 + k * .15);
    const reach = .30 + .30 * S.tentacle;
    const pts = [];
    for (let s = 0; s <= 1.001; s += .05){
      const y = H * (.98 - s * reach);
      const x = baseX + Math.sin(phase + s * 5.2) * (W * .115) * s;
      pts.push([x, y]);
    }
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = `rgba(10,20,22,${a})`;
    ctx.lineWidth = (17 - k * 2.6) * (.7 + S.tentacle * .5);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.stroke();

    // 빨판
    ctx.fillStyle = `rgba(${60 + S.tint[0] * .18},${110},${105},${a * .55})`;
    for (let i = 2; i < pts.length - 1; i += 2){
      const w = (13 - k * 2) * (1 - i / pts.length) * .5;
      ctx.beginPath();
      ctx.arc(pts[i][0] + w * .5, pts[i][1], Math.max(.8, w * .32), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* 침전 중 떠오르는 숫자 */
function drawRisingNumber(t){
  if (S.phase !== "settling" || !S.pending) return;
  const p = Math.min(1, (performance.now() - S.settleStart) / SETTLE_MS);
  const rise = (1 - p * p) * H * .22;
  const alpha = Math.max(0, p - .30) * 1.25 * (1 - S.turbid * .65);
  if (alpha <= 0) return;
  const txt = (p < .84)
    ? String(1 + Math.floor(Math.random() * (mode.id === "d100" ? 100 : mode.faces * mode.count)))
    : String(S.pending.total);
  ctx.save();
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.font = `${Math.round(W * .18)}px "Iowan Old Style", Georgia, serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(95,240,212,.9)"; ctx.shadowBlur = 26;
  ctx.fillStyle = "rgba(215,250,246,.88)";
  ctx.fillText(txt, W * .5, H * .62 + rise);
  ctx.restore();
}

/* ================= 유리 · 라벨 ================= */
function drawElderSign(c, x, y, s, alpha){
  c.save();
  c.globalAlpha = alpha;
  c.strokeStyle = "rgba(40,26,14,.85)";
  c.lineWidth = 1.3; c.lineCap = "round";
  c.beginPath();
  for (let i = 0; i <= 5; i++){
    const ang = (i * 2 / 5) * Math.PI * 2 - Math.PI / 2;
    const px = x + Math.cos(ang) * s, py = y + Math.sin(ang) * s;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);

  c.stroke();
  c.beginPath(); c.ellipse(x, y, s * .34, s * .22, 0, 0, Math.PI * 2);
  c.fillStyle = "rgba(40,26,14,.55)"; c.fill();
  c.beginPath(); c.arc(x, y, s * .1, 0, Math.PI * 2);
  c.fillStyle = "rgba(20,12,6,.9)"; c.fill();
  c.restore();
}
function drawLabel(){
  const x = W * .30, y = H * .60, w = W * .40, h = H * .17;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(-.012);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "rgba(206,188,148,.30)");
  g.addColorStop(1, "rgba(150,132,98,.24)");
  ctx.beginPath();
  ctx.moveTo(2, 0); ctx.lineTo(w - 3, 2); ctx.lineTo(w, h - 2); ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(60,44,24,.28)"; ctx.lineWidth = 1; ctx.stroke();

  drawElderSign(ctx, w * .5, h * .38, h * .24, .55);

  for (let i = 0; i < 2; i++){
    const yy = h * (.72 + i * .13);
    ctx.beginPath(); ctx.moveTo(w * .18, yy); ctx.lineTo(w * .82, yy); ctx.stroke();
  }
  ctx.restore();
}
function drawGlass(){
  ctx.save();
  ctx.strokeStyle = "rgba(160,225,225,.28)"; ctx.lineWidth = 3.2; ctx.stroke(PATH);
  ctx.strokeStyle = "rgba(220,255,255,.10)"; ctx.lineWidth = 8;   ctx.stroke(PATH);

  ctx.save();
  ctx.clip(PATH);
  const hg = ctx.createLinearGradient(W * .16, 0, W * .42, 0);
  hg.addColorStop(0, "rgba(255,255,255,.15)");
  hg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
  ctx.beginPath();
  ctx.ellipse(W * .30, H * .62, W * .022, H * .16, .06, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fill();
  ctx.restore();

  // 밀랍 봉인된 코르크
  const cg = ctx.createLinearGradient(0, H * .03, 0, H * .12);
  cg.addColorStop(0, "#6b5334"); cg.addColorStop(1, "#3a2c1b");
  ctx.beginPath();
  ctx.moveTo(W * .398, H * .118); ctx.lineTo(W * .409, H * .035);
  ctx.quadraticCurveTo(W * .5, H * .018, W * .591, H * .035);
  ctx.lineTo(W * .602, H * .118); ctx.closePath();
  ctx.fillStyle = cg; ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W * .392, H * .100);
  ctx.quadraticCurveTo(W * .5, H * .118, W * .608, H * .100);
  ctx.lineTo(W * .606, H * .128);
  ctx.quadraticCurveTo(W * .5, H * .146, W * .394, H * .128);
  ctx.closePath();
  ctx.fillStyle = "rgba(74,18,20,.82)"; ctx.fill();
  drawElderSign(ctx, W * .5, H * .118, H * .016, .5);
  ctx.restore();
}
function drawGlow(){
  if (S.glow < .02) return;
  const [r, g, b] = S.tint;
  const rad = ctx.createRadialGradient(W * .5, H * .64, 0, W * .5, H * .64, W * .62);
  rad.addColorStop(0, `rgba(${r},${g},${b},${.28 * S.glow})`);
  rad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = rad; ctx.fillRect(0, 0, W, H);
}

/* ================= 배경: 심연과 그것 ================= */
const spores = [];
for (let i = 0; i < 46; i++){
  spores.push({ x:Math.random(), y:Math.random(), r:.4 + Math.random() * 1.6,
                v:.000012 + Math.random() * .00005, s:Math.random() * 6.28 });
}
function drawTitan(t){
  const a = .045 + S.dread * .26;
  const cx = BW * .5, base = BH * (1.16 - S.dread * .13);
  const s = Math.min(BW, BH) * (.62 + S.dread * .06);
  bctx.save();
  bctx.globalAlpha = 1;

  // 날개
  bctx.beginPath();
  bctx.moveTo(cx - s * .30, base - s * .62);
  bctx.quadraticCurveTo(cx - s * 1.35, base - s * 1.02, cx - s * 1.02, base - s * .06);
  bctx.quadraticCurveTo(cx - s * .78, base - s * .42, cx - s * .32, base - s * .34);
  bctx.closePath();
  bctx.moveTo(cx + s * .30, base - s * .62);
  bctx.quadraticCurveTo(cx + s * 1.35, base - s * 1.02, cx + s * 1.02, base - s * .06);
  bctx.quadraticCurveTo(cx + s * .78, base - s * .42, cx + s * .32, base - s * .34);
  bctx.closePath();
  bctx.fillStyle = `rgba(0,0,0,${a * .8})`; bctx.fill();

  // 머리와 몸
  bctx.beginPath();
  bctx.moveTo(cx - s * .40, base);
  bctx.lineTo(cx - s * .34, base - s * .52);
  bctx.quadraticCurveTo(cx - s * .32, base - s * .92, cx, base - s * .95);
  bctx.quadraticCurveTo(cx + s * .32, base - s * .92, cx + s * .34, base - s * .52);
  bctx.lineTo(cx + s * .40, base);
  bctx.closePath();
  bctx.fillStyle = `rgba(0,0,0,${a})`; bctx.fill();
  bctx.strokeStyle = `rgba(70,140,130,${a * .5})`; bctx.lineWidth = 1.2; bctx.stroke();

  // 얼굴의 촉수 다발
  bctx.strokeStyle = `rgba(0,0,0,${a})`;
  bctx.lineCap = "round";
  for (let k = 0; k < 7; k++){
    const off = (k - 3) / 3;
    bctx.beginPath();
    bctx.lineWidth = s * (.055 - Math.abs(off) * .012);
    bctx.moveTo(cx + off * s * .17, base - s * .70);
    bctx.quadraticCurveTo(
      cx + off * s * .30 + Math.sin(t * .0007 + k) * s * .05, base - s * .48,
      cx + off * s * .24 + Math.sin(t * .0009 + k * 1.7) * s * .09, base - s * .27);
    bctx.stroke();
  }

  // 두 눈은 dread가 높을 때만 뜬다
  if (S.dread > .18){
    const ea = (S.dread - .18) * .9;
    const key = S.result && S.result.verdict ? S.result.verdict.key : "plain";
    drawEye(bctx, cx - s * .155, base - s * .80, s * .052, Math.min(1, ea * 2), key, Math.min(.85, ea));
    drawEye(bctx, cx + s * .155, base - s * .80, s * .052, Math.min(1, ea * 2), key, Math.min(.85, ea));
  }
  bctx.restore();
}
function drawAbyss(t){
  bctx.clearRect(0, 0, BW, BH);

  // 심연 배경
  const g = bctx.createRadialGradient(BW * .5, BH * .18, 0, BW * .5, BH * .18, Math.max(BW, BH) * .95);
  g.addColorStop(0, "#11202b");
  g.addColorStop(.5, "#081420");
  g.addColorStop(1, "#03060a");
  bctx.fillStyle = g; bctx.fillRect(0, 0, BW, BH);

  // 수면에서 내려오는 빛줄기
  bctx.save();
  bctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 4; i++){
    const x = BW * (.18 + i * .22) + Math.sin(t * .0002 + i) * BW * .05;
    const lg = bctx.createLinearGradient(x, 0, x + BW * .06, BH * .8);
    lg.addColorStop(0, `rgba(90,190,190,${.05 + S.dread * .02})`);
    lg.addColorStop(1, "rgba(90,190,190,0)");
    bctx.fillStyle = lg;
    bctx.beginPath();
    bctx.moveTo(x - BW * .03, 0); bctx.lineTo(x + BW * .05, 0);
    bctx.lineTo(x + BW * .13, BH * .85); bctx.lineTo(x - BW * .06, BH * .85);
    bctx.closePath(); bctx.fill();
  }
  bctx.restore();

  drawTitan(t);

  // 부유물
  for (const sp of spores){
    sp.y -= sp.v * 16.7;
    if (sp.y < -.02) sp.y = 1.02;
    const px = (sp.x + Math.sin(t * .0004 + sp.s) * .012) * BW;
    bctx.beginPath();
    bctx.arc(px, sp.y * BH, sp.r, 0, Math.PI * 2);
    bctx.fillStyle = `rgba(150,220,215,${.05 + .05 * Math.sin(t * .002 + sp.s)})`;
    bctx.fill();
  }

  // 비네트
  const v = bctx.createRadialGradient(BW * .5, BH * .5, Math.min(BW, BH) * .28,
                                      BW * .5, BH * .5, Math.max(BW, BH) * .78);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, `rgba(${S.dread > .5 ? 20 : 0},0,0,.72)`);
  bctx.fillStyle = v; bctx.fillRect(0, 0, BW, BH);
}

/* ================= 루프 ================= */
let prev = performance.now();
function frame(now){
  const dt = Math.min(48, now - prev); prev = now;
  const k = dt / 16.667;

  if (holding) addEnergy(.16 * k * (.7 + Math.random() * .6));

  S.energy *= Math.pow(.955, k);
  if (S.energy < .002) S.energy = 0;

  const targetTurbid = S.phase === "shaking" ? 1 : Math.min(1, S.energy * 1.3);
  S.turbid += (targetTurbid - S.turbid) * (S.phase === "shaking" ? .07 : .035) * k;

  S.velX += (0 - S.offX) * .18 * k - S.velX * .22 * k;
  S.velY += (0 - S.offY) * .18 * k - S.velY * .22 * k;
  S.offX += S.velX * .18 * k; S.offY += S.velY * .18 * k;
  if (S.energy > .1){
    S.offX += (Math.random() - .5) * S.energy * 5.5 * k;
    S.offY += (Math.random() - .5) * S.energy * 3.2 * k;
  }
  S.rot += ((S.offX * .0016) - S.rot) * .15 * k;
  S.slope *= Math.pow(.97, k);
  S.glow *= Math.pow(.997, k);
  S.dread *= Math.pow(.9965, k);

  // 촉수는 평상시 옅게 유지, 대실패 뒤 서서히 가라앉는다
  S.tentacle += (Math.max(.12, S.energy * .5) - S.tentacle) * .012 * k;
  // 의식 서클은 흔들수록 밝아진다
  S.ritual += ((S.energy * .9 + S.glow * .5) - S.ritual) * .06 * k;

  // 상태 전이
  if (S.phase === "shaking" && S.energy < .06 && now - S.shakeStart > MIN_SHAKE_MS){
    S.phase = "settling"; S.settleStart = now;
    S.eyeKey = S.pending && S.pending.verdict ? S.pending.verdict.key : "plain";
    S.eyeX = .5; S.eyeY = .60;
  }
  if (S.phase === "settling"){
    const p = (now - S.settleStart) / SETTLE_MS;
    // 눈이 떴다가, 숫자가 떠오르면 감긴다
    const target = p < .12 ? 0 : p < .55 ? 1 : p < .78 ? .6 : 0;
    S.eye += (target - S.eye) * .10 * k;
    if (now - S.settleStart > SETTLE_MS){
      S.phase = "revealed"; S.result = S.pending; showResult(S.result);
    }
  } else if (S.phase === "idle"){
    // 가끔 심연이 혼자 눈을 뜬다
    S.nextBlink -= dt;
    if (S.nextBlink <= 0){
      S.nextBlink = 9000 + Math.random() * 14000;
      S.eyeKey = "plain";
      S.eyeX = .34 + Math.random() * .32;
      S.eyeY = .58 + Math.random() * .22;
      S.eye = .001; S.blinkUntil = now + 1900;
    }
    const opening = S.blinkUntil && now < S.blinkUntil;
    S.eye += ((opening ? 1 : 0) - S.eye) * .045 * k;
  } else {
    S.eye += (0 - S.eye) * .08 * k;
  }

  audio.frame(S.energy);

  /* ---- 배경 ---- */
  drawAbyss(now);

  /* ---- 포션 ---- */
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2 + S.offX, H / 2 + S.offY);
  ctx.rotate(S.rot);
  ctx.translate(-W / 2, -H / 2);

  PATH = bottlePath();
  drawRitual(now);
  drawGlow();

  ctx.save();
  ctx.clip(PATH);
  ctx.fillStyle = "rgba(5,12,18,.55)";
  ctx.fillRect(0, 0, W, H);
  drawLiquid(now);
  drawTentacles(now);
  drawEye(ctx, S.eyeX * W, S.eyeY * H, W * .17, S.eye,
          S.phase === "idle" ? "plain" : S.eyeKey,
          S.phase === "idle" ? .45 : .92);
  drawMotes(now);
  drawBubbles(now, dt);
  drawRisingNumber(now);
  ctx.restore();

  drawLabel();
  drawGlass();
  drawEtchedRunes(now);
  ctx.restore();

  requestAnimationFrame(frame);
}

resize();
initMotes();
requestAnimationFrame(frame);
})();
</script>
